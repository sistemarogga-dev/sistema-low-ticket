<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1D1B">
<title>Sistema de Execução Low Ticket</title>
<meta name="description" content="Organize suas ofertas low ticket nas 5 etapas: desenvolvimento, criação do produto, página de vendas, estrutura e criativos.">
<meta name="application-name" content="Low Ticket">
<meta name="apple-mobile-web-app-title" content="Low Ticket">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: trilho de ícones escuro + barra lateral escura (indicadores e lista de ofertas) + área principal clara de cantos amplos; acentos verde-limão e lilás. */
:root{
  --shell:#1C1D1B; --shell-2:#272825; --shell-3:#31322F; --shell-line:#3B3C38; --shell-fg:#F1F1EC; --shell-muted:#9B9C95;
  --main:#ECECE8; --surface:#FFFFFF; --surface-2:#E3E3DE; --line:#D8D8D2; --fg:#1C1D1B; --muted:#6A6B65;
  --lime:#DCF07A; --lime-2:#F0F8C8; --lav:#B9A9F2; --lav-2:#E6E0FB; --coral:#F27F86; --coral-2:#FCDDDF; --sky:#94D3EE; --sky-2:#DAF0F9;
  --ink:#1C1D1B; --danger:#C4373F;
  --s1:#A9AAA3; --s2:var(--lav); --s3:var(--coral); --s4:var(--sky); --s5:var(--lime); --s6:#F5B26B;
  --f-ui:"Urbanist","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r-xl:28px; --r-lg:20px; --r-md:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --shell:#121311; --shell-2:#1D1E1B; --shell-3:#262724; --shell-line:#31322E; --shell-fg:#F1F1EC; --shell-muted:#9B9C95;
  --main:#242522; --surface:#2E2F2C; --surface-2:#393A36; --line:#454641; --fg:#EFEFEA; --muted:#A8A9A1; --danger:#F08A90; color-scheme:dark}}
:root[data-theme="dark"]{
  --shell:#121311; --shell-2:#1D1E1B; --shell-3:#262724; --shell-line:#31322E; --shell-fg:#F1F1EC; --shell-muted:#9B9C95;
  --main:#242522; --surface:#2E2F2C; --surface-2:#393A36; --line:#454641; --fg:#EFEFEA; --muted:#A8A9A1; --danger:#F08A90; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--shell);color:var(--fg);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.01em;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
[hidden]{display:none!important}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

/* casca */
.shell{height:100%;display:grid;grid-template-columns:76px 330px minmax(0,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.shell.solo{grid-template-columns:76px minmax(0,1fr)}
.shell.sem-rail{grid-template-columns:minmax(0,1fr)}
.shell.sem-rail .rail{display:none}
.rail{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0;color:var(--shell-muted)}
.logo{width:44px;height:44px;flex:none;display:grid;place-items:center;color:var(--lime);margin-bottom:14px}
.logo svg{width:34px;height:34px;stroke-width:3.4}
.rail-btn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--shell-line);background:none;color:var(--shell-muted);display:grid;place-items:center;cursor:pointer}
.rail-btn:hover{color:var(--shell-fg);border-color:var(--shell-muted)}
.rail-btn[aria-current="page"]{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.rail-btn.add{background:var(--shell-3);color:var(--lime);border-color:transparent}
.rail .grow{flex:1}
.avatar{width:40px;height:40px;flex:none;border-radius:50%;background:var(--lav);color:var(--ink);display:grid;place-items:center;font-weight:700;border:0;cursor:pointer}

.side{overflow:auto;padding:18px 14px 24px 4px;color:var(--shell-fg);display:flex;flex-direction:column;gap:18px}
.brand{display:grid;gap:2px;padding:6px 2px 0}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.brand small{color:var(--shell-muted);font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--shell-2);border-radius:var(--r-lg);padding:14px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between}
.tile span{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--shell-muted)}
.tile span i{width:14px;height:14px;border-radius:50%;border:2px solid var(--c)}
.tile strong{font-size:34px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.tile strong small{font-size:15px;color:var(--shell-muted)}
.list-head{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.list-head i{width:14px;height:14px;border-radius:4px;border:2px solid var(--lime)}
.list-head .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--shell-muted)}
.side-search{background:var(--shell-2);border:1px solid var(--shell-line);border-radius:99px;padding:8px 14px;color:var(--shell-fg);width:100%}
.side-search::placeholder{color:var(--shell-muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--shell-line);background:none;color:var(--shell-muted);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--shell-fg);color:var(--shell);border-color:var(--shell-fg)}
.olist{display:grid;gap:10px}
.ocard{background:var(--shell-2);border:0;border-radius:var(--r-lg);padding:14px;display:grid;gap:10px;text-align:left;color:var(--shell-fg);cursor:pointer;width:100%;position:relative}
.ocard:hover{background:var(--shell-3)}
.ocard .arrow{position:absolute;top:12px;right:12px;color:var(--shell-muted)}
.ocard .arrow svg{width:16px;height:16px}
.ocard b{font-weight:600;font-size:15.5px;padding-right:22px;line-height:1.25}
.ocard small{color:var(--shell-muted);font-size:12.5px;margin-top:-6px}
.ocard .row{display:flex;align-items:center;gap:8px;border:1px solid var(--shell-line);border-radius:12px;padding:8px 10px;font-size:12.5px}
.ocard .row .ico svg{width:16px;height:16px}
.ocard .row .tag{margin-left:auto}
.ocard[aria-current="true"]{background:var(--lime);color:var(--ink)}
.ocard[aria-current="true"] small,.ocard[aria-current="true"] .arrow{color:#3F4436}
.ocard[aria-current="true"] .row{border-color:rgb(28 29 27 / .18);background:rgb(255 255 255 / .35)}
.side-empty{color:var(--shell-muted);font-size:14px;padding:4px 2px}

.main{overflow:auto;background:var(--main);border-radius:var(--r-xl);margin:12px 12px 12px 0;padding:28px 30px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-content:start}
.main>*{min-width:0}

/* comuns */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--c,var(--surface-2));color:var(--ink);white-space:nowrap}
.tag.soft{background:var(--surface-2);color:var(--fg)}
.idchip{font:500 11.5px var(--f-mono);letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:99px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--main)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:none}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn .ico svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.round{width:44px;height:44px;border-radius:50%;background:var(--lime);color:var(--ink);border:0;display:grid;place-items:center;cursor:pointer;text-decoration:none;flex:none}
.round:hover{filter:brightness(.95)}
.round[aria-disabled="true"]{background:var(--surface-2);color:var(--muted);pointer-events:none}
.card{background:var(--surface);border-radius:var(--r-lg);padding:20px}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--fg));border-radius:inherit}
.inp,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--main);border-radius:12px;padding:9px 12px;width:100%;min-width:0;color:var(--fg)}
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field textarea,textarea.inp{resize:vertical;min-height:70px;line-height:1.45}
.money{position:relative;display:block}
.money::before{content:"R$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.money input{padding-left:36px;font-variant-numeric:tabular-nums}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:34px;font-weight:500;letter-spacing:-.02em}
.head p{margin:4px 0 0;color:var(--muted)}
.sec-title{display:flex;align-items:baseline;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.sec-title h2{font-size:20px}
.sec-title p{margin:0;color:var(--muted);font-size:14px}

/* painel */
.board-scroll{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:12px;min-width:min-content}
.col{background:var(--surface-2);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:130px}
.col-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:4px 6px}
.col-head .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.bcard{background:var(--surface);border:0;border-radius:var(--r-md);padding:12px;display:grid;gap:8px;cursor:pointer;text-align:left;width:100%;color:var(--fg)}
.bcard:hover{outline:2px solid var(--c)}
.bcard b{font-weight:600;line-height:1.3}
.bcard .meta{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--f-mono);color:var(--muted)}
.col-empty{font-size:13px;color:var(--muted);padding:2px 6px}
.table-scroll{overflow-x:auto;background:var(--surface);border-radius:var(--r-lg)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:960px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:14px 16px 10px;font-weight:600;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--main)}
td.num{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{background:var(--surface);border-radius:var(--r-lg);padding:40px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h3{font-size:20px}
.empty p{margin:0;color:var(--muted);max-width:52ch}

/* oferta */
.o-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}
.o-name{font:500 38px/1.1 var(--f-ui);letter-spacing:-.02em;border:1px solid transparent;background:none;border-radius:12px;padding:2px 8px;margin-left:-9px;width:100%;color:var(--fg)}
.o-name:hover{border-color:var(--line)}
.o-name:focus{border-color:var(--lav);outline:none;background:var(--surface)}
.o-meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px;margin-top:8px}
.o-meta b{color:var(--fg);font-weight:600}
.o-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.o-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{background:none;border:0;padding:10px 18px;border-radius:14px 14px 0 0;cursor:pointer;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg)}
.o-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.o-col{display:grid;gap:14px;min-width:0}
.o-right{display:grid;gap:14px;position:sticky;top:0}
.lavcard{background:var(--lav);color:var(--ink);border-radius:var(--r-lg);padding:20px;display:grid;gap:12px}
.lavcard .big{font-size:44px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.lavcard .label,.limecard .label{color:#3D3A52}
.limecard .label{color:#454B2A}
.steps{display:grid;gap:8px}
.stp{display:flex;align-items:center;gap:10px;font-size:14px;background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer}
.stp i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgb(28 29 27 / .35);flex:none}
.stp i svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stp.done i{background:rgb(255 255 255 / .55);border-color:transparent}
.stp.cur{font-weight:700}
.stp span{flex:1}
.stp small{font:500 12px var(--f-mono)}
.limecard{background:var(--lime);color:var(--ink);border-radius:var(--r-lg);padding:20px;display:grid;gap:10px}
.limecard .tag,.lavcard .tag{background:rgb(255 255 255 / .65)}
.whitebox{background:rgb(255 255 255 / .7);border-radius:12px;padding:10px 12px;font-size:14px;display:grid;gap:2px}
.whitebox b{font-weight:600}

.stage{background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.stage>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px;flex-wrap:wrap}
.stage>summary::-webkit-details-marker{display:none}
.snum{width:40px;height:40px;border-radius:50%;background:var(--c);color:var(--ink);display:grid;place-items:center;font:500 14px var(--f-mono);flex:none}
.stage>summary>div{flex:1 1 220px;min-width:0}
.stage>summary h3{font-size:17px}
.stage>summary small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.scount{margin-left:auto;display:flex;align-items:center;gap:10px;font:500 13px var(--f-mono);color:var(--muted)}
.scount .bar{width:90px}
.chev{transition:transform .15s;color:var(--muted);font-size:20px;line-height:1}
.stage[open] .chev{transform:rotate(90deg)}
.sbody{padding:0 18px 16px 72px;display:grid;gap:2px}
.sinfo{background:var(--main);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--muted);display:grid;gap:2px;margin-bottom:6px}
.sinfo p{margin:0}
.sinfo b{color:var(--fg);font-weight:600}
.task{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-of-type{border-bottom:0}
.check{appearance:none;width:24px;height:24px;border:1.8px solid var(--line);border-radius:50%;cursor:pointer;display:grid;place-items:center;margin:0;background:var(--surface)}
.check:hover{border-color:var(--muted)}
.check:checked{background:var(--c);border-color:var(--c)}
.check:checked::after{content:"";width:5px;height:10px;border:solid var(--ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.ttext{display:grid;gap:4px;min-width:0}
.ttext>span{line-height:1.45}
.task.done .ttext>span{color:var(--muted);text-decoration:line-through}
.task small{color:var(--muted);font-size:13px}
.task small b{font-weight:600;color:var(--fg)}
.nextbadge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--c);color:var(--ink);padding:1px 8px;border-radius:99px;margin-left:8px;white-space:nowrap}
.tdet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:6px}
.tdet .inp{font-size:13.5px;padding:7px 10px}
.mini{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px;font-size:13px;white-space:nowrap;font-weight:600;text-decoration:none}
.mini:hover{background:var(--main);color:var(--fg)}
.add-row{display:flex;gap:8px;padding-top:10px}
.add-row .inp{flex:1}
.danger-zone{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px}
.banner{background:var(--lav-2);color:var(--ink);border-radius:var(--r-md);padding:10px 14px;font-size:14px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.6fr);gap:14px}
.card h3{font-size:18px;margin-bottom:4px}
.card>p.hint{margin:0 0 14px;color:var(--muted);font-size:14px}
.rows{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:center}
.lrow.bump{grid-template-columns:minmax(0,1.6fr) 140px auto}
.sum{display:flex;gap:20px;flex-wrap:wrap;background:var(--main);border-radius:12px;padding:12px 14px;font-size:14px}
.sum b{font:500 15px var(--f-mono)}

.gen{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:grid;gap:12px}
.gen-head{display:flex;gap:14px;align-items:flex-start}
.gen-head .round{width:40px;height:40px;background:var(--c)}
.gen-head h3{font-size:17px}
.gen-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.warn{font-size:13px;background:var(--coral-2);color:var(--ink);border-radius:10px;padding:8px 12px}
.gen-acts{display:flex;gap:8px;flex-wrap:wrap}
.gen details summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600}
.gen pre{white-space:pre-wrap;background:var(--main);border-radius:12px;padding:12px;font:13px/1.5 var(--f-mono);max-height:320px;overflow:auto;margin:8px 0 0}

/* modelos e backup */
.tpl{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;display:grid;gap:10px}
.tpl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tpl-head h3{font-size:17px}
.tpl-head p{margin:0;color:var(--muted);font-size:13.5px;flex-basis:100%}
.tpl-row,.tpl-cols{display:grid;grid-template-columns:24px minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:start}
.tpl-row .ord{font:500 12px var(--f-mono);color:var(--muted);padding-top:10px;text-align:right}
.tpl-row textarea{min-height:44px}
.acts{display:flex}
.savebar{position:sticky;bottom:0;background:var(--fg);color:var(--main);border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savebar span{margin-right:auto}
.savebar .btn{border-color:transparent}

/* modal, aviso, carregando */
.overlay{position:fixed;inset:0;background:rgb(12 13 11 / .55);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-xl);padding:26px;width:min(560px,100%);display:grid;gap:14px;max-height:100%;overflow:auto}
.modal h2{font-size:24px;font-weight:600}
.modal p{margin:0;color:var(--muted);font-size:14px}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px;cursor:pointer;position:relative}
.radio:has(input:checked){border-color:var(--ink);background:var(--lime);color:var(--ink)}
.radio:has(input:checked) small{color:#454B2A}
.radio input{position:absolute;opacity:0;pointer-events:none}
.radio b{font-weight:700}
.radio small{color:var(--muted);font-size:12.5px}
.modal-acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lime);color:var(--ink);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.skel{height:110px;border-radius:var(--r-lg);background:var(--surface-2);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.center{display:grid;place-items:center;min-height:70vh}
.login{background:var(--surface);border-radius:var(--r-xl);padding:32px;max-width:440px;display:grid;gap:14px;text-align:center;justify-items:center}
.login h1{font-size:28px;font-weight:600}
.login p{margin:0;color:var(--muted)}

@media (max-width:1180px){.o-grid{grid-template-columns:minmax(0,1fr)}.o-right{position:static;grid-template-columns:1fr 1fr}}
@media (max-width:1000px){
  html,body{height:auto}
  .shell,.shell.solo{height:auto;grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;padding:10px max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:6;background:var(--shell)}
  .logo{margin:0}
  .rail{gap:5px;overflow-x:auto}
  .rail-btn,.avatar,.logo{width:clamp(30px,8.6vw,44px);height:clamp(30px,8.6vw,44px)}
  .logo svg{width:70%;height:70%}
  .rail .grow{flex:1}
  .side{padding:4px 16px 8px;overflow:visible}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tile{min-height:80px;padding:10px}
  .tile strong{font-size:26px}
  .olist{display:flex;overflow-x:auto;gap:10px;padding-bottom:4px}
  .ocard{width:250px;flex:none}
  .main{margin:0 8px 8px;padding:22px 16px 40px;overflow:visible}
}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .o-head{grid-template-columns:minmax(0,1fr)}
  .o-tags{justify-content:flex-start}
  .o-right{grid-template-columns:minmax(0,1fr)}
  .o-name{font-size:30px}
  .grid2,.grid3,.tdet{grid-template-columns:minmax(0,1fr)}
  .sbody{padding-left:18px}
  .lrow,.lrow.bump{grid-template-columns:minmax(0,1fr) auto}
  .lrow>:nth-child(2){grid-column:1}
  .tpl-row,.tpl-cols{grid-template-columns:24px minmax(0,1fr)}
  .tpl-row>:nth-child(n+3){grid-column:2}
  .tpl-cols>:nth-child(n+3){display:none}
  .radios{grid-template-columns:1fr}
  .head h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.chev{transition:none}}

const itensDe = m => Object.entries(m || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

function resumo(o) {
  let tot = 0, ok = 0, atual = null, prox = null; const por = {};
  for (const e of ETAPAS) {
    const ts = tarefasDe(o, e.key); const d = ts.filter(t => t.feito).length;
    por[e.key] = { tot: ts.length, ok: d }; tot += ts.length; ok += d;
    if (!atual && d < ts.length) { atual = e; prox = ts.find(t => !t.feito); }
  }
  return { tot, ok, pct: tot ? ok / tot : 0, atual, prox, concluida: tot > 0 && ok === tot, por };
}
const pctTxt = p => Math.round(p * 100) + '%';
const tagEtapa = e => `<span class="tag" style="--c:${cv(e.cor)}">${e.num} · ${esc(e.nome)}</span>`;
function proximaEtapa(r) {
  if (r.concluida) return '<b>Oferta concluída</b>';
  if (!r.atual) return '—';
  const n = ETAPAS[ETAPAS.indexOf(r.atual) + 1];
  return n ? `<b>${n.num} · ${esc(n.nome)}</b>` : '<b>Esta é a última etapa</b>';
}

/* ---------- Armazenamento ---------- */
const docs = s => s.docs.map(d => ({ ...clone(d.data()), id: d.id }));
function adapterClaude(db) {
  return {
    watchOfertas: (ok, err) => db.collection('ofertas').onSnapshot(s => ok(docs(s)), err),
    watchModelos: ok => db.doc('config/modelos').onSnapshot(s => ok(s.exists ? s.data() : null), () => ok(null)),
    patch: (id, p) => db.doc('ofertas/' + id).update(p),
    put: (id, b) => db.doc('ofertas/' + id).set(b),
    del: id => db.doc('ofertas/' + id).delete(),
    putModelos: b => db.doc('config/modelos').set(b)
  };
}
function adapterFirebase(fs, uid) {
  const base = fs.collection('users').doc(uid);
  return {
    watchOfertas: (ok, err) => base.collection('ofertas').onSnapshot(s => ok(docs(s)), err),
    watchModelos: ok => base.collection('config').doc('modelos').onSnapshot(s => ok(s.exists ? s.data() : null), () => ok(null)),
    patch: (id, p) => base.collection('ofertas').doc(id).set(p, { merge: true }),
    put: (id, b) => base.collection('ofertas').doc(id).set(b),
    del: id => base.collection('ofertas').doc(id).delete(),
    putModelos: b => base.collection('config').doc('modelos').set(b)
  };
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ ofertas, modelos })); }
  catch { toast('Não foi possível salvar neste navegador.'); }
}
function enqueue(id, fn) {
  inflight++;
  chains[id] = (chains[id] || Promise.resolve()).then(fn).catch(err => {
    toast(err && err.code === 'quota_exceeded' ? 'Limite de armazenamento atingido. Exclua ofertas antigas.' : 'Não foi possível salvar. Verifique a conexão e tente de novo.');
  }).finally(() => { inflight--; });
}
function patchOferta(id, patch, delay = 0) {
  const o = ofertas.find(x => x.id === id); if (o) merge(o, patch);
  if (mode === 'local') { saveLocal(); return; }
  pend[id] = merge(pend[id] || {}, patch);
  clearTimeout(timers[id]);
  if (delay) timers[id] = setTimeout(() => flush(id), delay); else flush(id);
}
function flush(id) {
  clearTimeout(timers[id]);
  const p = pend[id]; if (!p) return; delete pend[id];
  enqueue(id, () => S.patch(id, clone(p)));
}
const flushAll = () => Object.keys(pend).forEach(flush);
function gravarInteira(o) {
  if (mode === 'local') { saveLocal(); return; }
  delete pend[o.id]; clearTimeout(timers[o.id]);
  const { id, ...body } = clone(o);
  enqueue(id, () => S.put(id, body));
}
function excluirOferta(id) {
  ofertas = ofertas.filter(o => o.id !== id);
  delete pend[id]; clearTimeout(timers[id]);
  if (mode === 'local') saveLocal(); else enqueue(id, () => S.del(id));
}
function salvarModelos(novos) {
  modelos = clone(novos);
  if (mode === 'local') { saveLocal(); return; }
  enqueue('config', () => S.putModelos({ listas: clone(novos), migracoes: modelosMigr, atualizadoEm: new Date().toISOString() }));
}

/* ---------- Ações ---------- */
function nomeUnico(base) {
  const nomes = new Set(ofertas.map(o => o.nome.trim().toLowerCase()));
  if (!nomes.has(base.toLowerCase())) return base;
  for (let i = 2; ; i++) if (!nomes.has(`${base} ${i}`.toLowerCase())) return `${base} ${i}`;
}
function criarOferta({ nome, origem: org, link, obs, ticket, checkout, pagina }) {
  const etapas = {};
  for (const e of ETAPAS) {
    const ts = {};
    listaPara(e.key, org).forEach((m, i) => { ts['t' + (i + 1)] = { t: m.t, ev: m.ev || '', como: m.como || '', ...(m.ferramenta ? { ferramenta: m.ferramenta } : {}), ordem: i + 1, feito: false, link: '', nota: '' }; });
    etapas[e.key] = ts;
  }
  const o = { id: novoId(), nome, origem: org, rota: ROTA[org], link: link || '', obs: obs || '', ticket: ticket ?? null, checkout: checkout || '', pagina: pagina || '',
    ficha: {}, bonus: {}, bumps: {}, gerados: {}, arquivada: false, migracoes: MIGRACOES.map(x => x.id), criadoEm: new Date().toISOString(), etapas };
  ofertas.push(o); gravarInteira(o); return o;
}
function duplicarOferta(o) {
  const c = clone(o);
  c.id = novoId(); c.nome = nomeUnico(o.nome + ' (variação)'); c.criadoEm = new Date().toISOString();
  c.arquivada = false; c.pagina = ''; c.gerados = {}; c.conversas = {};
  for (const ek in c.etapas || {}) for (const tid in c.etapas[ek]) Object.assign(c.etapas[ek][tid], { feito: false, feitoEm: '', link: '', nota: '' });
  ofertas.push(c); gravarInteira(c); return c;
}

/* ---------- Gerador de copy ---------- */
const linhas = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
function contexto(o) {
  const f = o.ficha || {};
  const L2 = (t, v) => v ? `${t}: ${v}` : '';
  const LL = (t, v) => linhas(v).length ? `${t}:\n${linhas(v).map(x => '- ' + x).join('\n')}` : '';
  const bonus = itensDe(o.bonus).filter(b => b.nome);
  const bumps = itensDe(o.bumps).filter(b => b.nome);
  return [
    `Produto: ${o.nome}`,
    L2('Formato do entregável', f.formato),
    L2('Headline atual', f.headline), L2('Subheadline atual', f.subheadline),
    typeof o.ticket === 'number' ? `Preço (ticket): ${fmtValor(o.ticket)}` : '',
    L2('Público-alvo', f.publico), L2('Dor principal', f.dor), L2('Promessa / transformação', f.promessa), L2('Mecanismo único', f.mecanismo),
    LL('Vantagens da oferta', f.vantagens),
    LL('Comentários reais do público (use o vocabulário deles)', f.comentarios),
    LL('Objeções a quebrar', f.objecoes),
    bonus.length ? 'Bônus:\n' + bonus.map(b => `- ${b.nome}${b.desc ? ': ' + b.desc : ''}`).join('\n') : '',
    bumps.length ? 'Order bumps:\n' + bumps.map(b => `- ${b.nome}${typeof b.preco === 'number' ? ' (' + fmtValor(b.preco) + ')' : ''}`).join('\n') : ''
  ].filter(Boolean).join('\n');
}

function copiar(texto, ok) {
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let feito = false; try { feito = document.execCommand('copy'); } catch {}
    ta.remove(); toast(feito ? ok : 'Não consegui copiar sozinho. Abra "Ver prompt" e copie o texto.');
  };
  try { navigator.clipboard.writeText(texto).then(() => toast(ok), fallback); } catch { fallback(); }
}

/* ---------- Render ---------- */
function captureFocus() {
  const a = document.activeElement;
  if (!a || !a.id || !shell.contains(a)) return null;
  return { id: a.id, s: a.selectionStart, e: a.selectionEnd };
}
function restoreFocus(f) {
  if (!f) return; const el = document.getElementById(f.id); if (!el) return;
  el.focus({ preventScroll: true });
  try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch {}
}
const editando = () => { const a = document.activeElement; return a && shell.contains(a) && a.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea'); };
function scheduleRender() { if (editando()) { needRender = true; return; } render(); }
shell.addEventListener('focusout', () => { if (needRender) setTimeout(() => { if (!editando() && needRender) { needRender = false; render(); } }, 0); });

function render() {
  const f = captureFocus();
  for (const v of ['painel', 'modelos', 'backup', 'equipe']) document.getElementById('nav-' + v).toggleAttribute('aria-current', false);

  side.hidden = !comDados || sideOculta;

}

  const rs = ofertas.filter(o => !o.arquivada).map(o => ({ o, r: resumo(o) }));
  const head = `<div class="head"><div><h1>Painel</h1><p>Onde cada oferta está no método das 5 etapas.</p></div><button class="btn lime" data-act="nova"><span class="ico">${I.plus}</span>Nova oferta</button></div>`;
  if (!rs.length) return head + `<div class="empty"><h3>Nenhuma oferta ativa</h3><p>Cadastre o nome e a origem (Mineração ou Concepção). O sistema gera na hora o checklist das etapas 02 a 05.</p><button class="btn lime" data-act="nova">Cadastrar oferta</button></div>`;
  const cols = [...ETAPAS.map(e => ({ key: e.key, nome: e.num + ' · ' + e.nome, cor: e.cor })), { key: 'ok', nome: 'Concluídas', cor: '--lime' }];
  const board = cols.map(c => {
    const itens = rs.filter(x => c.key === 'ok' ? x.r.concluida : x.r.atual && x.r.atual.key === c.key).sort((a, b) => b.r.pct - a.r.pct);
    const cards = itens.map(({ o, r }) => {
      const pe = r.atual ? r.por[r.atual.key] : null;
      return `<button type="button" class="bcard" style="--c:${cv(c.cor)}" data-act="abrir" data-id="${esc(o.id)}">
        <b>${esc(o.nome)}</b>
        <div class="bar"><i style="width:${pe ? Math.round(pe.ok / pe.tot * 100) : 100}%"></i></div>
        <span class="meta"><span>${typeof o.ticket === 'number' ? fmtValor(o.ticket) : esc(o.id)}</span><span>${pctTxt(r.pct)}</span></span></button>`;
    }).join('');
    return `<div class="col"><div class="col-head"><span class="dot" style="--c:${cv(c.cor)}"></span>${esc(c.nome)}<span class="n">${itens.length}</span></div>${cards || '<div class="col-empty">Nenhuma oferta aqui</div>'}</div>`;
  }).join('');
  const rows = rs.sort((a, b) => String(b.o.criadoEm).localeCompare(String(a.o.criadoEm))).map(({ o, r }) => `<tr data-act="abrir" data-id="${esc(o.id)}">
      <td><div style="display:grid;gap:2px"><b style="font-weight:600">${esc(o.nome)}</b><span class="idchip">${esc(o.id)}</span></div></td>
      <td>${esc(o.origem)}</td>
      <td class="num">${fmtValor(o.ticket)}</td>
      <td>${o.checkout ? esc(o.checkout) : '<span style="color:var(--muted)">—</span>'}</td>
      <td>${r.concluida ? '<span class="tag" style="--c:var(--lime)">Concluída</span>' : r.atual ? tagEtapa(r.atual) : '—'}</td>
      <td class="num"><div style="display:grid;gap:4px;min-width:90px">${pctTxt(r.pct)}<div class="bar"><i style="width:${Math.round(r.pct * 100)}%"></i></div></div></td>
      <td>${urlOk(o.pagina) ? `<a href="${esc(o.pagina)}" target="_blank" rel="noopener" data-act="link" class="mini">Abrir ↗</a>` : '<span style="color:var(--muted)">—</span>'}</td>
      <td class="num">${fmtData(o.criadoEm)}</td></tr>`).join('');
  return head + `
  <section><div class="sec-title"><h2>Pipeline</h2><p>Cada oferta aparece na primeira etapa que ainda tem tarefa pendente.</p></div>
    <div class="board-scroll"><div class="board">${board}</div></div></section>
  <section><div class="sec-title"><h2>Todas as ofertas ativas</h2></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Produto</th><th>Origem</th><th>Ticket</th><th>Checkout</th><th>Etapa atual</th><th>Progresso</th><th>Página</th><th>Cadastro</th></tr></thead>
      <tbody>${rows}</tbody></table></div></section>`;
}

function renderOferta(o) {
  const r = resumo(o);
  const atualKey = r.concluida ? null : r.atual && r.atual.key;
  const tags = `${o.arquivada ? '<span class="tag soft">Arquivada</span>' : ''}${r.concluida ? '<span class="tag" style="--c:var(--lime)">Concluída</span>' : r.atual ? tagEtapa(r.atual) : ''}<span class="tag" style="--c:var(--surface-2);color:var(--fg)">${esc(o.origem)} · ${esc(o.rota || ROTA[o.origem] || '')}</span>`;
  const head = `<div class="o-head">
    <div>
      <input class="o-name" id="f-nome" data-path="nome" value="${esc(o.nome)}" aria-label="Nome da oferta">
      <div class="o-meta"><span class="idchip">${esc(o.id)}</span><span>Ticket <b>${fmtValor(o.ticket)}</b></span><span>Checkout <b>${o.checkout ? esc(o.checkout) : '—'}</b></span><span>Cadastrada em ${fmtData(o.criadoEm)}</span></div>
      <div class="o-actions">
        <a class="round ico" ${urlOk(o.pagina) ? `href="${esc(o.pagina)}" target="_blank" rel="noopener"` : 'aria-disabled="true"'} title="Abrir página de vendas" aria-label="Abrir página de vendas">${I.page}</a>
        ${urlOk(o.link) || !temDrive()
          ? `<a class="round ico" ${urlOk(o.link) ? `href="${esc(o.link)}" target="_blank" rel="noopener"` : 'aria-disabled="true"'} title="Abrir pasta" aria-label="Abrir pasta">${I.folder}</a>`
          : `<button type="button" class="round ico" data-act="criar-pasta" title="Criar pasta no Google Drive" aria-label="Criar pasta no Google Drive" style="background:var(--surface-2);color:var(--fg)">${I.folder}</button>`}
        <button type="button" class="round ico" data-act="duplicar" title="Duplicar oferta" aria-label="Duplicar oferta">${I.copy}</button>
        <button type="button" class="round ico" data-act="arquivar" title="${o.arquivada ? 'Desarquivar' : 'Arquivar'}" aria-label="${o.arquivada ? 'Desarquivar' : 'Arquivar'}">${I.archive}</button>
      </div>
    </div>
    <div class="o-tags">${tags}</div>
  </div>`;
  const tab = (k, t) => `<button type="button" class="tab" role="tab" data-act="aba" data-aba="${k}" aria-selected="${aba === k}">${t}</button>`;
  const tabs = `<div class="tabs" role="tablist">${tab('checklist', 'Checklist')}${tab('ficha', 'Ficha da oferta')}${tab('gerador', 'Gerador de copy')}${tab('dados', 'Dados')}</div>`;
  const steps = ETAPAS.map(e => {
    const p = r.por[e.key];
    const done = p.tot > 0 && p.ok === p.tot;
    return `<button type="button" class="stp ${done ? 'done' : ''} ${e.key === atualKey ? 'cur' : ''}" data-act="ir-etapa" data-k="${e.key}">
      <i>${done ? I.check : ''}</i><span>${e.num} · ${esc(e.nome)}</span><small>${p.ok}/${p.tot}</small></button>`;
  }).join('');
  const bumps = itensDe(o.bumps).filter(b => typeof b.preco === 'number');
  const potencial = (typeof o.ticket === 'number' ? o.ticket : 0) + bumps.reduce((s, b) => s + b.preco, 0);
  const right = `<div class="o-right">
    <div class="lavcard"><span class="label">Progresso geral</span><div class="big">${pctTxt(r.pct)}</div>
      <span style="font-size:14px">${r.ok} de ${r.tot} tarefas concluídas</span><div class="steps">${steps}</div></div>
    <div class="limecard"><span class="label">Etapa atual</span>
      <div class="whitebox">${r.concluida ? '<b>Oferta concluída</b>' : r.atual ? `<b>${r.atual.num} · ${esc(r.atual.nome)}</b>` : '—'}</div>
      <span class="label">Próxima etapa</span><div class="whitebox">${proximaEtapa(r)}</div>
      ${potencial ? `<span class="label">Ticket com todos os bumps</span><div class="whitebox"><b>${fmtValor(potencial)}</b></div>` : ''}
    </div></div>`;
  let corpo = '';
  if (aba === 'ficha') corpo = renderFicha(o, potencial);
  else if (aba === 'gerador') corpo = renderGerador(o);
  else if (aba === 'dados') corpo = renderDados(o);
  else corpo = renderChecklist(o, r, atualKey);
  return `<button type="button" class="mini" data-act="nav" data-view="painel" style="justify-self:start;padding-left:0">← Painel</button>
    ${head}${tabs}<div class="o-grid"><div class="o-col">${corpo}</div>${right}</div>`;
}

function renderChecklist(o, r, atualKey) {
  return ETAPAS.map(e => {
    const ts = tarefasDe(o, e.key); const p = r.por[e.key];
    const k = o.id + e.key;
    const open = k in abertas ? abertas[k] : e.key === atualKey;
    const items = ts.map(t => {
      const isNext = r.prox && r.prox.id === t.id && e.key === atualKey;
      const did = o.id + e.key + t.id;
      const det = detalhes.has(did) || t.link || t.nota;
      return `<div class="task ${t.feito ? 'done' : ''}">
        <input type="checkbox" class="check" id="c-${esc(did)}" data-check data-e="${e.key}" data-t="${esc(t.id)}" ${t.feito ? 'checked' : ''} aria-label="Concluir: ${esc(t.t)}">
        <div class="ttext">
          <span>${esc(t.t)}${isNext ? '<span class="nextbadge">Próxima</span>' : ''}</span>
          ${t.ev ? `<small><b>Entrega:</b> ${esc(t.ev)}</small>` : ''}
          ${t.como ? `<small><b>Como fazer:</b> ${esc(t.como)}</small>` : ''}
          ${det ? `<div class="tdet">
            <input class="inp" id="l-${esc(did)}" type="url" placeholder="Link / registro" value="${esc(t.link)}" data-path="etapas.${e.key}.${esc(t.id)}.link" aria-label="Link ou registro">
            <input class="inp" id="n-${esc(did)}" type="text" placeholder="Anotação ou evidência" value="${esc(t.nota)}" data-path="etapas.${e.key}.${esc(t.id)}.nota" aria-label="Anotação"></div>` : ''}
        </div>
        <div style="display:flex">
          ${urlOk(t.link) ? `<a class="mini" href="${esc(t.link)}" target="_blank" rel="noopener">Abrir</a>` : ''}
          ${!det ? `<button type="button" class="mini" data-act="det" data-d="${esc(did)}">+ Registro</button>` : ''}
          ${t.ferramenta && urlOk(t.ferramenta.url) ? `<a class="btn sm lime" href="${esc(t.ferramenta.url)}" target="_blank" rel="noopener">${esc(t.ferramenta.nome || 'Abrir')} ↗</a>` : ''}
          ${t.extra ? `<button type="button" class="mini" data-act="rm-extra" data-e="${e.key}" data-t="${esc(t.id)}">Remover</button>` : ''}
        </div></div>`;
    }).join('');
    return `<details class="stage" id="st-${e.key}" style="--c:${cv(e.cor)}" data-k="${esc(k)}" ${open ? 'open' : ''}>
      <summary><span class="snum">${e.num}</span><div><h3>${esc(e.titulo)}</h3><small>${esc(e.desc)}</small></div>
        <span class="scount">${p.ok}/${p.tot}<span class="bar"><i style="width:${p.tot ? Math.round(p.ok / p.tot * 100) : 0}%"></i></span><span class="chev" aria-hidden="true">›</span></span></summary>
      <div class="sbody">
        <div class="sinfo"><p>${esc(e.foco)}</p><p><b>Referências:</b> ${esc(e.refs)}</p></div>
        ${items || '<p style="color:var(--muted);margin:8px 0">Nenhuma tarefa nesta etapa.</p>'}
        <form class="add-row" data-form="extra" data-e="${e.key}">
          <input class="inp" id="x-${e.key}" placeholder="Adicionar tarefa extra só nesta oferta" aria-label="Nova tarefa extra">
          <button class="btn sm" type="submit">Adicionar</button></form>
      </div></details>`;
  }).join('');
}

function renderFicha(o, potencial) {
  const f = o.ficha || {};
  const campo = c => `<label class="field" ${c.area ? '' : ''}><span class="label">${esc(c.t)}</span>${c.area
    ? `<textarea id="fi-${c.k}" data-path="ficha.${c.k}" rows="3" placeholder="${esc(c.ph)}">${esc(f[c.k])}</textarea>`
    : `<input id="fi-${c.k}" data-path="ficha.${c.k}" value="${esc(f[c.k])}" placeholder="${esc(c.ph)}">`}</label>`;
  const bonus = itensDe(o.bonus).map(b => `<div class="lrow">
      <input class="inp" id="bo-${esc(b.id)}-n" data-path="bonus.${esc(b.id)}.nome" value="${esc(b.nome)}" placeholder="Nome do bônus" aria-label="Nome do bônus">
      <input class="inp" id="bo-${esc(b.id)}-d" data-path="bonus.${esc(b.id)}.desc" value="${esc(b.desc)}" placeholder="O que entrega" aria-label="Descrição do bônus">
      <button type="button" class="mini" data-act="rm-item" data-lista="bonus" data-id="${esc(b.id)}">Remover</button></div>`).join('');
  const bumps = itensDe(o.bumps).map(b => `<div class="lrow bump">
      <input class="inp" id="bu-${esc(b.id)}-n" data-path="bumps.${esc(b.id)}.nome" value="${esc(b.nome)}" placeholder="Nome do order bump" aria-label="Nome do order bump">
      <span class="money"><input class="inp" id="bu-${esc(b.id)}-p" data-path="bumps.${esc(b.id)}.preco" data-num inputmode="decimal" value="${esc(fmtEdit(b.preco))}" placeholder="0,00" aria-label="Preço do order bump"></span>
      <button type="button" class="mini" data-act="rm-item" data-lista="bumps" data-id="${esc(b.id)}">Remover</button></div>`).join('');
  return `<div class="card"><h3>Ficha da oferta</h3><p class="hint">A pesquisa da etapa 02 em um só lugar. Ela alimenta o gerador de copy.</p>
      <div class="grid2">${FICHA.map(campo).join('')}</div></div>
    <div class="card"><h3>Estrutura da oferta</h3><p class="hint">Produto principal, bônus e order bumps.</p>
      <div style="display:grid;gap:16px">
        <div class="grid2">
          <label class="field"><span class="label">Produto principal</span><input id="fi-entregavel" data-path="ficha.entregavel" value="${esc((o.ficha || {}).entregavel)}" placeholder="Nome do entregável principal"></label>
          <label class="field"><span class="label">Ticket</span><span class="money"><input id="fi-ticket" data-path="ticket" data-num inputmode="decimal" value="${esc(fmtEdit(o.ticket))}" placeholder="0,00"></span></label>
        </div>
        <div class="field"><span class="label">Bônus</span><div class="rows">${bonus || '<span style="color:var(--muted);font-size:14px">Nenhum bônus ainda.</span>'}</div>
          <div><button type="button" class="btn sm" data-act="add-item" data-lista="bonus">+ Adicionar bônus</button></div></div>
        <div class="field"><span class="label">Order bumps</span><div class="rows">${bumps || '<span style="color:var(--muted);font-size:14px">Nenhum order bump ainda.</span>'}</div>
          <div><button type="button" class="btn sm" data-act="add-item" data-lista="bumps">+ Adicionar order bump</button></div></div>
        <div class="sum"><span>Ticket <b>${fmtValor(o.ticket)}</b></span><span>Bumps <b>${fmtValor(itensDe(o.bumps).reduce((s, b) => s + (typeof b.preco === 'number' ? b.preco : 0), 0))}</b></span><span>Comprando tudo <b>${fmtValor(potencial)}</b></span></div>
      </div></div>`;
}

const ferramentaIA = url => {
  const h = (() => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } })();
  if (/(^|\.)chatgpt\.com$|(^|\.)chat\.openai\.com$/.test(h)) return { nome: 'ChatGPT', cor: 'var(--sky)' };
  if (/(^|\.)claude\.ai$/.test(h)) return { nome: 'Claude', cor: 'var(--coral)' };
  if (/(^|\.)gemini\.google\.com$/.test(h)) return { nome: 'Gemini', cor: 'var(--lav)' };
  return { nome: h || 'Link', cor: 'var(--surface-2)' };
};
function renderConversas(o, sufixo) {
  const lista = itensDe(o.conversas).sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm)));
  const rows = lista.map(c => {
    const f = ferramentaIA(c.url);
    return `<div class="lrow" style="grid-template-columns:auto minmax(0,1fr) auto auto">
      <span class="tag" style="--c:${f.cor}">${esc(f.nome)}</span>
      <span style="min-width:0;overflow-wrap:anywhere"><b style="font-weight:600">${esc(c.titulo || 'Conversa sem título')}</b><br><small style="color:var(--muted)">${fmtData(c.criadoEm)}</small></span>
      <a class="btn sm" href="${esc(c.url)}" target="_blank" rel="noopener">Abrir ↗</a>
      <button type="button" class="mini" data-act="rm-item" data-lista="conversas" data-id="${esc(c.id)}">Remover</button></div>`;
  }).join('');
  return `<div class="card" style="display:grid;gap:12px"><h3 style="margin:0">Conversas com IA</h3>
      <p class="hint" style="margin:0">Guarde os links dos chats do ChatGPT, Claude ou Gemini usados nesta oferta.</p>
      <form class="grid3" data-form="conversa" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;align-items:end">
        <label class="field"><span class="label">Título (opcional)</span><input id="cv-t-${sufixo}" placeholder="Ex.: Copy da página v2"></label>
        <label class="field"><span class="label">Link da conversa</span><input id="cv-u-${sufixo}" type="url" required placeholder="https://chatgpt.com/c/…"></label>
        <button type="submit" class="btn lime sm" style="height:40px">Salvar link</button>
      </form>
      <div class="rows">${rows || '<span style="color:var(--muted);font-size:14px">Nenhuma conversa salva ainda.</span>'}</div></div>`;
}
function renderGerador(o) {
  const f = o.ficha || {};
  return `<div class="card" style="padding:16px 20px"><p style="margin:0;color:var(--muted);font-size:14px">Cada botão monta um prompt com os dados da Ficha. Copie e cole no ChatGPT ou no Claude, e guarde o link da conversa aqui embaixo para não perder.</p></div>` +
  renderConversas(o, 'g') +
  GERADORES.map(g => {
    const e = ETAPA_POR[g.etapa];
    const faltam = g.precisa.filter(k => !String(f[k] || '').trim()).map(k => FICHA_NOME[k]);
    const prompt = g.prompt(o);
    return `<div class="gen" style="--c:${cv(e.cor)}">
      <div class="gen-head"><span class="round ico">${g.icon}</span><div><h3>${esc(g.titulo)}</h3><p>${esc(g.desc)} · Etapa ${e.num}</p></div></div>
      ${faltam.length ? `<div class="warn">Preencha na Ficha para um resultado melhor: ${esc(faltam.join(', '))}.</div>` : ''}
      <div class="gen-acts">
        <button type="button" class="btn dark sm" data-act="copiar-prompt" data-g="${g.k}"><span class="ico">${I.copy}</span>Copiar prompt</button>
        <a class="btn sm" href="https://chatgpt.com/" target="_blank" rel="noopener">Abrir ChatGPT ↗</a>
        <a class="btn sm" href="https://claude.ai/new" target="_blank" rel="noopener">Abrir Claude ↗</a>
      </div>
      <details><summary>Ver prompt</summary><pre>${esc(prompt)}</pre></details>
    </div>`;
  }).join('');
}

function renderDados(o) {
  return `<div class="card"><h3>Dados da oferta</h3><p class="hint">Links e informações de venda.</p>
      <div style="display:grid;gap:14px">
        <div class="grid3">
          <label class="field"><span class="label">Ticket</span><span class="money"><input id="f-ticket" data-path="ticket" data-num inputmode="decimal" value="${esc(fmtEdit(o.ticket))}" placeholder="0,00"></span></label>
          <label class="field"><span class="label">Plataforma de checkout</span><select id="f-checkout" data-path="checkout">${optsPlataforma(o.checkout)}</select></label>
          <label class="field"><span class="label">Página de vendas</span><input id="f-pagina" type="url" data-path="pagina" value="${esc(o.pagina)}" placeholder="https://…"></label>
        </div>
        <div class="grid2">
          <label class="field"><span class="label">Pasta / link</span><input id="f-link" type="url" data-path="link" value="${esc(o.link)}" placeholder="https://drive.google.com/…">
            ${temDrive() && !o.link ? `<button type="button" class="btn sm lime" data-act="criar-pasta" style="justify-self:start;margin-top:4px"><span class="ico">${I.folder}</span>Criar pasta no Drive</button>` : ''}</label>
          <label class="field"><span class="label">Observações</span><textarea id="f-obs" data-path="obs" rows="2" placeholder="Nicho, ideias, pendências…">${esc(o.obs)}</textarea></label>
        </div>
      </div></div>
    ${renderConversas(o, 'd')}
    <div class="danger-zone">${confirmDel
      ? `<span>Excluir “${esc(o.nome)}” e todo o checklist? Não dá para desfazer.</span><button class="btn danger solid sm" data-act="excluir-sim">Excluir de vez</button><button class="btn sm" data-act="excluir-nao">Cancelar</button>`
      : `<button class="btn danger sm" data-act="excluir">Excluir oferta</button><span>Prefira arquivar: a oferta sai das listas sem perder nada.</span>`}</div>`;
}

function renderModelos() {
  if (!draft) draft = clone(modelos);
  const dirty = JSON.stringify(draft) !== JSON.stringify(modelos);
  const blocos = LISTAS.map(l => {
    const e = ETAPA_POR[l.etapa];
    const rows = (draft[l.k] || []).map((m, i, arr) => `<div class="tpl-row">
      <span class="ord">${i + 1}</span>
      <textarea class="inp" id="m-${l.k}-${i}-t" data-m="${l.k}" data-i="${i}" data-mf="t" rows="2" aria-label="Tarefa">${esc(m.t)}</textarea>
      <textarea class="inp" id="m-${l.k}-${i}-ev" data-m="${l.k}" data-i="${i}" data-mf="ev" rows="2" placeholder="Entrega / evidência" aria-label="Entrega">${esc(m.ev)}</textarea>
      <textarea class="inp" id="m-${l.k}-${i}-como" data-m="${l.k}" data-i="${i}" data-mf="como" rows="2" placeholder="Como fazer · referências" aria-label="Como fazer">${esc(m.como)}</textarea>
      <span class="acts">
        <button type="button" class="mini" data-act="m-up" data-m="${l.k}" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
        <button type="button" class="mini" data-act="m-down" data-m="${l.k}" data-i="${i}" ${i === arr.length - 1 ? 'disabled' : ''} aria-label="Descer">↓</button>
        <button type="button" class="mini" data-act="m-rm" data-m="${l.k}" data-i="${i}" aria-label="Remover">✕</button></span></div>`).join('');
    return `<div class="tpl"><div class="tpl-head"><span class="snum" style="--c:${cv(e.cor)};width:30px;height:30px;font-size:12px">${e.num}</span><h3>${esc(l.rotulo)}</h3><span class="tag soft">${(draft[l.k] || []).length} tarefas</span><p>${esc(l.ajuda)}</p></div>

/* ---------- Início ---------- */
let primeiro = true;

// Mudanças pontuais no método: aplicadas uma única vez aos modelos e a cada oferta (marcadas em "migracoes").
const T_REGISTRAR = 'Registrar os melhores comentários para conhecermos a fundo o público. (Essa pesquisa de público será essencial para escrever a copy da página de vendas).';

const T_EXTRAIR_TODOS = [T_REGISTRAR, T_EXTRAIR_V1, T_EXTRAIR_V2, T_EXTRAIR];
const T_CHECKLIST = 'Preencher o checklist da oferta.';
const T_FICHA = 'Preencher a Ficha da oferta.';
const MIGRACOES = [
  { id: 'chk-oferta',
    modelos: m => {
      for (const k of ['e2_Modelagem', 'e2_Refinamento']) {
        const l = m[k]; if (!l || l.some(x => x.t === T_CHECKLIST || x.t === T_FICHA)) continue;
        const i = l.findIndex(x => T_EXTRAIR_TODOS.includes(x.t));

      ts.forEach(({ id, ...v }, j) => { o.etapas.e2[id] = { ...v, ordem: j + 1 }; });
    } },
  { id: 'sem-vantagens-doc',
    modelos: m => {

    },
    oferta: o => {

      for (const id in e2) if (DEV_REMOVIDOS.includes(e2[id].t)) delete e2[id];
      tarefasDe(o, 'e2').forEach((t, j) => { e2[t.id].ordem = j + 1; });
    } },
  { id: 'ficha-oferta',
    modelos: m => {

  { id: 'extrator-youtube',

    },
    oferta: o => {
      const e2 = (o.etapas || {}).e2; if (!e2) return;

    } },
  { id: 'extrator-texto-v2',

    oferta: o => {

];
function migrarTudo() {
  const m = clone(modelos);
  let mudouModelos = migrarModelos(m);
  for (const mg of MIGRACOES) if (!modelosMigr.includes(mg.id)) { mg.modelos(m); modelosMigr = [...modelosMigr, mg.id]; mudouModelos = true; }
  if (mudouModelos) salvarModelos(m);
  for (const o of ofertas) {
    let mudou = migrarOferta(o);
    for (const mg of MIGRACOES) if (!(o.migracoes || []).includes(mg.id)) { mg.oferta(o); o.migracoes = [...(o.migracoes || []), mg.id]; mudou = true; }
    if (mudou) gravarInteira(o);

}
function conectar() {
  unsubs.forEach(u => { try { u(); } catch {} }); unsubs = [];
  let okOfertas = false, okModelos = false, migrou = false;
  const tentarMigrar = () => { if (okOfertas && okModelos && !migrou) { migrou = true; migrarTudo(); } };
  unsubs.push(S.watchModelos(d => { modelos = d && d.listas ? clone(d.listas) : clone(MODELOS_PADRAO); modelosMigr = (d && d.migracoes) || []; okModelos = true; tentarMigrar(); if (okOfertas) scheduleRender(); }));
  unsubs.push(S.watchOfertas(lista => {
    ofertas = lista;
    for (const id in pend) { const o = ofertas.find(x => x.id === id); if (o) merge(o, pend[id]); }
    okOfertas = true; mode = 'remote'; tentarMigrar(); aplicarHash(); scheduleRender();
  }, err => {
    if (err && err.code === 'permission-denied') { mode = 'semacesso'; render(); }
    else toast('Não foi possível carregar as ofertas. Recarregue a página.');
  }));
}
function entrarNoSistema(u) {
  contaEmail = u.email || '';
  if (!u.emailVerified) { mode = 'verificar'; render(); return; }
  mode = 'loading'; render();
  const fs = window.firebase.firestore();

function msgAuth(e) {
  const c = (e && e.code) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'E-mail ou senha incorretos. Se você nunca criou senha, entre com o Google.';
  if (/invalid-email/.test(c)) return 'Esse e-mail não parece válido.';
  if (/too-many-requests/.test(c)) return 'Muitas tentativas. Espere alguns minutos e tente de novo.';
  if (/weak-password/.test(c)) return 'Senha fraca. Use pelo menos 6 caracteres.';
  if (/requires-recent-login/.test(c)) return 'Por segurança, saia, entre de novo com o Google e crie a senha logo em seguida.';
  if (/provider-already-linked|email-already-in-use|credential-already-in-use/.test(c)) return 'Esta conta já tem senha. Use "Receber e-mail para trocar a senha".';
  if (/operation-not-allowed/.test(c)) return 'O login com e-mail e senha não está ativado no Firebase.';
  if (/network/.test(c)) return 'Sem conexão. Verifique a internet.';
  if (/popup-closed|cancelled-popup/.test(c)) return 'A janela do Google foi fechada antes de terminar.';
  if (/unauthorized-domain/.test(c)) return 'Este endereço não está autorizado no Firebase.';
  return 'Não foi possível concluir. Tente de novo.';
}
/* ---------- Google Drive: pasta da oferta ---------- */
const DRIVE_RAIZ = 'Ofertas Low Ticket';
const DRIVE_PASTA = 'application/vnd.google-apps.folder';
let driveToken = { valor: '', expira: 0 };
const temDrive = () => origem === 'firebase';
// Abre a janela do Google na hora do clique (antes de qualquer espera), senão o navegador bloqueia o pop-up.
function tokenDrive() {
  if (driveToken.valor && Date.now() < driveToken.expira) return Promise.resolve(driveToken.valor);
  const auth = window.firebase.auth(); const u = auth.currentUser;
  const prov = new window.firebase.auth.GoogleAuthProvider();
  prov.addScope('https://www.googleapis.com/auth/drive.file');
  prov.setCustomParameters({ login_hint: u.email || '' });
  const temGoogle = u.providerData.some(p => p.providerId === 'google.com');
  return (temGoogle ? u.reauthenticateWithPopup(prov) : u.linkWithPopup(prov)).then(r => {
    const t = r.credential && r.credential.accessToken;
    if (!t) throw new Error('sem-token');
    driveToken = { valor: t, expira: Date.now() + 50 * 60 * 1000 };
    return t;
  });
}
async function driveApi(token, url, opts = {}) {
  const r = await fetch('https://www.googleapis.com/drive/v3/' + url, { ...opts, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (!r.ok) { const e = new Error('drive-' + r.status); e.status = r.status; throw e; }
  return r.json();
}
const criarPastaApi = (token, nome, pai) => driveApi(token, 'files?fields=id,webViewLink', {
  method: 'POST', body: JSON.stringify({ name: nome, mimeType: DRIVE_PASTA, ...(pai ? { parents: [pai] } : {}) })
});
async function pastaRaiz(token) {
  const q = encodeURIComponent(`name='${DRIVE_RAIZ}' and mimeType='${DRIVE_PASTA}' and trashed=false and 'root' in parents`);
  const r = await driveApi(token, `files?q=${q}&fields=files(id)&spaces=drive`);
  if (r.files && r.files.length) return r.files[0].id;
  return (await criarPastaApi(token, DRIVE_RAIZ)).id;
}
// Cria "Ofertas Low Ticket/<nome da oferta>" e grava o link no campo Pasta da oferta.
function criarPastaDrive(o) {
  const t = tokenDrive();   // chamado de forma síncrona dentro do clique
  toast('Criando a pasta no Google Drive…');
  return t.then(async token => {
    const raiz = await pastaRaiz(token);
    const p = await criarPastaApi(token, o.nome, raiz);
    patchOferta(o.id, { link: p.webViewLink, pastaDriveId: p.id });
    if (focoId === o.id) render();
    toast('Pasta criada no Google Drive: ' + DRIVE_RAIZ + ' › ' + o.nome);
  }).catch(e => {
    if (e && e.status === 401) driveToken = { valor: '', expira: 0 };
    const c = (e && e.code) || '';
    toast(/popup-closed|cancelled-popup|user-cancelled/.test(c) ? 'Pasta não criada: a permissão do Google Drive não foi concedida. Você pode criar depois em Dados.'
      : /popup-blocked/.test(c) ? 'O navegador bloqueou a janela do Google. Libere pop-ups deste site e use "Criar pasta no Drive" em Dados.'
      : /credential-already-in-use/.test(c) ? 'Essa conta Google já está ligada a outro usuário do sistema.'
      : /user-mismatch/.test(c) ? 'Escolha na janela do Google a mesma conta com que você entrou no sistema (' + contaEmail + ').'
      : e && e.status === 403 ? 'O Google recusou o acesso ao Drive. Tente de novo em instantes.'
      : 'Não foi possível criar a pasta no Drive. Tente de novo em Dados.');
  });
}

function entrarGoogle() {
  const auth = window.firebase.auth(); const prov = new window.firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(prov).catch(err => {
    if (err && err.code === 'auth/popup-blocked') auth.signInWithRedirect(prov);
    else { loginMsg = { t: msgAuth(err), erro: true }; render(); }
  });
}
async function iniciar() {
  render();
  const cfg = window.LT_FIREBASE;
  if (cfg && window.firebase) {
    origem = 'firebase';
    if (!cfg.apiKey || /COLE/.test(cfg.apiKey)) { mode = 'setup'; render(); return; }
